<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>now</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #fff;
      color: #000;
      font-family: "Helvetica Neue", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px;
    }
    h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 64px);
      gap: 12px;
    }
    .grid button {
      height: 64px;
      background: #fff;
      color: #000;
      border: 2px solid #000;
      font-size: 22px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .grid button:hover,
    .grid button:focus-visible {
      background: #000;
      color: #fff;
      outline: none;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: #fff;
      color: #000;
      border: 2px solid #000;
      padding: 40px 56px 28px;
      text-align: center;
      min-width: 260px;
    }
    .modal-box p {
      margin: 0 0 28px;
      font-size: 26px;
    }
    .modal-box button {
      background: #000;
      color: #fff;
      border: 2px solid #000;
      padding: 10px 28px;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
    }
    .modal-box button:hover { background: #fff; color: #000; }
    @media (max-width: 400px) {
      .grid { grid-template-columns: repeat(5, 54px); gap: 8px; }
      .grid button { height: 54px; font-size: 19px; }
    }
  </style>
</head>
<body>
  <h1>now</h1>
  <div class="grid" id="grid"></div>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <p id="msg"></p>
      <button id="close">닫기</button>
    </div>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const modal = document.getElementById('modal');
    const msg = document.getElementById('msg');

    for (let n = 1; n <= 10; n++) {
      const b = document.createElement('button');
      b.textContent = n;
      b.onclick = () => {
        msg.textContent = n + '번 입니다.';
        modal.classList.add('open');
        document.getElementById('close').focus();
      };
      grid.appendChild(b);
    }

    const closeModal = () => modal.classList.remove('open');
    document.getElementById('close').onclick = closeModal;
    modal.onclick = (e) => { if (e.target === modal) closeModal(); };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
